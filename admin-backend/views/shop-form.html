<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{FORM_TITLE}} — BikeLabs Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#f0f0f0;font-family:system-ui,sans-serif;min-height:100vh}
.topbar{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-size:1.3rem;font-weight:900;color:#FF6B00;letter-spacing:-1px}.brand span{color:#f0f0f0}
nav a{color:#aaa;text-decoration:none;margin-left:1.5rem;font-size:.9rem;padding:.3rem .6rem;border-radius:4px}
nav a:hover,nav a.active{color:#FF6B00}
.logout{background:none;border:1px solid #3a3a3a;color:#aaa;padding:.3rem .8rem;border-radius:4px;cursor:pointer;font-size:.85rem;margin-left:1.5rem}
.logout:hover{border-color:#FF6B00;color:#FF6B00}
.main{max-width:800px;margin:0 auto;padding:2.5rem 2rem}
h1{font-size:1.8rem;margin-bottom:2rem}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:2rem;margin-bottom:1.5rem}
label{display:block;font-size:.82rem;color:#aaa;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:.4rem}
input,select,textarea{width:100%;background:#0f0f0f;border:1px solid #3a3a3a;color:#f0f0f0;padding:.65rem .85rem;border-radius:6px;font-size:.95rem;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#FF6B00}
textarea{min-height:100px;resize:vertical}
.field{margin-bottom:1.25rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.type-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem}
.type-tab{flex:1;padding:.65rem;border:1px solid #3a3a3a;background:#0f0f0f;color:#aaa;border-radius:6px;cursor:pointer;text-align:center;font-size:.9rem;transition:all .15s}
.type-tab.active{border-color:#FF6B00;color:#FF6B00;background:rgba(255,107,0,.08)}
.type-section{display:none}.type-section.show{display:block}
.btn-primary{background:#FF6B00;color:#fff;border:none;padding:.75rem 2rem;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#e05e00}
.btn-back{color:#aaa;text-decoration:none;font-size:.9rem;margin-left:1rem}
.btn-back:hover{color:#FF6B00}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">BIKE<span>LABS</span> <span style="color:#666;font-size:.75rem;font-weight:400;margin-left:.5rem">Admin</span></div>
  <nav>
    <a href="/admin">Dashboard</a>
    <a href="/admin/articles">Articles</a>
    <a href="/admin/shop" class="active">Shop</a>
    <form method="POST" action="/admin/logout" style="display:inline">
      <button class="logout">Sign Out</button>
    </form>
  </nav>
</div>
<div class="main">
  <h1>{{FORM_TITLE}}</h1>
  <form method="POST" action="{{FORM_ACTION}}" enctype="multipart/form-data">

    <div class="card">
      <div class="grid2">
        <div class="field">
          <label>Product Name</label>
          <input type="text" name="name" value="{{NAME}}" required>
        </div>
        <div class="field">
          <label>Category</label>
          <input type="text" name="category" value="{{CATEGORY}}" placeholder="e.g. Helmets, Jackets, Gloves">
        </div>
      </div>
      <div class="field">
        <label>Status</label>
        <select name="status">
          <option value="active" {{STATUS_ACTIVE}}>Active</option>
          <option value="inactive" {{STATUS_INACTIVE}}>Inactive</option>
        </select>
      </div>
    </div>

    <div class="card">
      <label style="margin-bottom:.75rem;display:block">Product Type</label>
      <div class="type-tabs">
        <div class="type-tab" data-type="amazon" onclick="setType('amazon')">Amazon</div>
        <div class="type-tab" data-type="aliexpress" onclick="setType('aliexpress')">AliExpress</div>
        <div class="type-tab" data-type="own" onclick="setType('own')">Own Product</div>
      </div>
      <input type="hidden" name="type" id="type-input" value="{{CURRENT_TYPE}}">

      <div class="type-section" id="section-amazon">
        <div class="field"><label>Amazon ASIN</label><input type="text" name="asin" value="{{ASIN}}" placeholder="e.g. B08N5WRWNW"></div>
        <div class="field"><label>Amazon Affiliate URL</label><input type="url" name="affiliate_url" value="{{AFFILIATE_URL}}" placeholder="https://amzn.to/..."></div>
        <div class="field"><label>Product Image URL</label><input type="url" name="imageUrl" value="{{IMAGE}}" placeholder="https://..."></div>
      </div>

      <div class="type-section" id="section-aliexpress">
        <div class="field"><label>AliExpress Affiliate URL</label><input type="url" name="affiliate_url" value="{{AFFILIATE_URL}}" placeholder="https://s.click.aliexpress.com/..."></div>
        <div class="field"><label>Product Image URL</label><input type="url" name="imageUrl" value="{{IMAGE}}" placeholder="https://..."></div>
      </div>

      <div class="type-section" id="section-own">
        <div class="grid2">
          <div class="field"><label>Price</label><input type="text" name="price" value="{{PRICE}}" placeholder="e.g. 49.99"></div>
          <div class="field"><label>Product URL</label><input type="url" name="own_url" value="{{OWN_URL}}" placeholder="https://..."></div>
        </div>
        <div class="field"><label>Upload Image</label><input type="file" name="imageFile" accept="image/*"></div>
        <div class="field"><label>Or Image URL</label><input type="url" name="imageUrl" value="{{IMAGE}}" placeholder="https://..."></div>
      </div>
    </div>

    <div class="card">
      <div class="field"><label>Verdict / Tagline</label><textarea name="verdict">{{VERDICT}}</textarea></div>
      <div class="field"><label>Full Description</label><textarea name="description" style="min-height:60px">{{DESCRIPTION}}</textarea></div>
    </div>

    <div>
      <button type="submit" class="btn-primary">Save Product</button>
      <a href="/admin/shop" class="btn-back">← Cancel</a>
    </div>
  </form>
</div>
<script>
(function(){
  var t = document.getElementById('type-input').value || 'amazon';
  setType(t);
})();
function setType(t) {
  document.getElementById('type-input').value = t;
  document.querySelectorAll('.type-tab').forEach(function(tab){
    tab.classList.toggle('active', tab.dataset.type === t);
  });
  document.querySelectorAll('.type-section').forEach(function(sec){
    sec.classList.toggle('show', sec.id === 'section-' + t);
  });
}
</script>
</body>
</html>
