<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{FORM_TITLE}} — BikeLabs Admin</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#f0f0f0;font-family:system-ui,sans-serif;min-height:100vh}
.topbar{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-size:1.3rem;font-weight:900;color:#FF6B00;letter-spacing:-1px}.brand span{color:#f0f0f0}
nav a{color:#aaa;text-decoration:none;margin-left:1.5rem;font-size:.9rem;padding:.3rem .6rem;border-radius:4px}
nav a:hover{color:#FF6B00}
.logout{background:none;border:1px solid #3a3a3a;color:#aaa;padding:.3rem .8rem;border-radius:4px;cursor:pointer;font-size:.85rem;margin-left:1.5rem}
.logout:hover{border-color:#FF6B00;color:#FF6B00}
.main{max-width:900px;margin:0 auto;padding:2.5rem 2rem}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
h1{font-size:1.8rem}
.back{color:#aaa;text-decoration:none;font-size:.9rem}
.back:hover{color:#FF6B00}
.form-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:2rem;margin-bottom:1.5rem}
.form-card h2{color:#FF6B00;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid #2a2a2a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.field label{font-size:.8rem;color:#aaa;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
input[type=text],input[type=url],input[type=number],select,textarea{background:#2a2a2a;border:1px solid #3a3a3a;color:#f0f0f0;padding:.65rem .9rem;border-radius:6px;font-size:.95rem;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#FF6B00}
select{cursor:pointer}
textarea{resize:vertical;min-height:80px}
.editor-toggle{display:flex;gap:.5rem;margin-bottom:.75rem}
.toggle-btn{background:#2a2a2a;color:#aaa;border:1px solid #3a3a3a;padding:.35rem .9rem;border-radius:4px;cursor:pointer;font-size:.82rem}
.toggle-btn.active{background:#FF6B00;color:#fff;border-color:#FF6B00}
#quill-editor{background:#1e1e1e;border:1px solid #3a3a3a;border-radius:0 0 6px 6px;min-height:320px}
.ql-toolbar{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px 6px 0 0}
.ql-toolbar .ql-stroke{stroke:#aaa}.ql-toolbar .ql-fill{fill:#aaa}
.ql-toolbar button:hover .ql-stroke{stroke:#FF6B00}.ql-toolbar button:hover .ql-fill{fill:#FF6B00}
.ql-editor{color:#f0f0f0;font-size:1rem;min-height:300px}
#raw-html-wrap{display:none}
#raw-html{width:100%;min-height:320px;background:#1e1e1e;border:1px solid #3a3a3a;color:#f0f0f0;padding:1rem;font-family:monospace;font-size:.9rem;border-radius:6px;resize:vertical}
#raw-html:focus{outline:none;border-color:#FF6B00}
.actions{display:flex;gap:1rem;align-items:center;margin-top:1.5rem}
.btn-save{background:#FF6B00;color:#fff;border:none;padding:.8rem 2rem;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.btn-save:hover{background:#e05e00}
.btn-cancel{color:#aaa;text-decoration:none;font-size:.9rem}
.btn-cancel:hover{color:#FF6B00}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">BIKE<span>LABS</span> <span style="color:#666;font-size:.75rem;font-weight:400;margin-left:.5rem">Admin</span></div>
  <nav>
    <a href="/admin">Dashboard</a>
    <a href="/admin/articles">Articles</a>
    <a href="/admin/shop">Shop</a>
    <form method="POST" action="/admin/logout" style="display:inline">
      <button class="logout">Sign Out</button>
    </form>
  </nav>
</div>
<div class="main">
  <div class="page-head">
    <h1>{{FORM_TITLE}}</h1>
    <a href="/admin/articles" class="back">← Back to Articles</a>
  </div>

  <form method="POST" action="{{ACTION}}" enctype="multipart/form-data" id="article-form">
    <div class="form-card">
      <h2>Article Details</h2>
      <div class="field"><label>Title *</label><input type="text" name="title" value="{{TITLE}}" required></div>
      <div class="row">
        <div class="field">
          <label>Section *</label>
          <select name="section" required>{{SECTION_OPTIONS}}</select>
        </div>
        <div class="field">
          <label>Status</label>
          <select name="status">
            <option value="draft" {{STATUS_DRAFT}}>Draft</option>
            <option value="published" {{STATUS_PUBLISHED}}>Published</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Excerpt / Description</label><textarea name="description" rows="3">{{DESCRIPTION}}</textarea></div>
      <div class="field"><label>Tags (comma-separated)</label><input type="text" name="tags" value="{{TAGS}}" placeholder="helmets, safety, review"></div>
    </div>

    <div class="form-card">
      <h2>Featured Image</h2>
      <div class="row">
        <div class="field"><label>Upload Image</label><input type="file" name="imageFile" accept="image/*" style="color:#aaa"></div>
        <div class="field"><label>Or Image URL</label><input type="url" name="imageUrl" value="{{IMAGE}}" placeholder="https://..."></div>
      </div>
    </div>

    <div class="form-card">
      <h2>Body Content</h2>
      <div class="editor-toggle">
        <button type="button" class="toggle-btn active" id="btn-wysiwyg" onclick="setMode('wysiwyg')">Visual Editor</button>
        <button type="button" class="toggle-btn" id="btn-html" onclick="setMode('html')">HTML</button>
      </div>
      <div id="quill-wrap">
        <div id="quill-editor"></div>
      </div>
      <div id="raw-html-wrap">
        <textarea id="raw-html" placeholder="Enter raw HTML..."></textarea>
      </div>
      <input type="hidden" name="body" id="body-input">
    </div>

    <div class="actions">
      <button type="submit" class="btn-save">Save Article</button>
      <a href="/admin/articles" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
var quill = new Quill('#quill-editor', {
  theme: 'snow',
  modules: { toolbar: [
    [{ header: [1,2,3,false] }],
    ['bold','italic','underline','strike'],
    ['link','blockquote','code-block'],
    [{ list: 'ordered' },{ list: 'bullet' }],
    ['clean']
  ]}
});

// Decode HTML entities from server
var rawBody = document.getElementById('body-input');
var initialHtml = `{{BODY}}`.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
quill.clipboard.dangerouslyPasteHTML(initialHtml);
document.getElementById('raw-html').value = initialHtml;

function setMode(mode) {
  if (mode === 'wysiwyg') {
    var html = document.getElementById('raw-html').value;
    quill.clipboard.dangerouslyPasteHTML(html);
    document.getElementById('quill-wrap').style.display = '';
    document.getElementById('raw-html-wrap').style.display = 'none';
    document.getElementById('btn-wysiwyg').classList.add('active');
    document.getElementById('btn-html').classList.remove('active');
  } else {
    document.getElementById('raw-html').value = quill.root.innerHTML;
    document.getElementById('quill-wrap').style.display = 'none';
    document.getElementById('raw-html-wrap').style.display = '';
    document.getElementById('btn-wysiwyg').classList.remove('active');
    document.getElementById('btn-html').classList.add('active');
  }
}

document.getElementById('article-form').addEventListener('submit', function() {
  var mode = document.getElementById('btn-html').classList.contains('active') ? 'html' : 'wysiwyg';
  if (mode === 'wysiwyg') {
    document.getElementById('body-input').value = quill.root.innerHTML;
  } else {
    document.getElementById('body-input').value = document.getElementById('raw-html').value;
  }
});
</script>
</body>
</html>
