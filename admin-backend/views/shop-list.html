<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — BikeLabs Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#f0f0f0;font-family:system-ui,sans-serif;min-height:100vh}
.topbar{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-size:1.3rem;font-weight:900;color:#FF6B00;letter-spacing:-1px}.brand span{color:#f0f0f0}
nav a{color:#aaa;text-decoration:none;margin-left:1.5rem;font-size:.9rem;padding:.3rem .6rem;border-radius:4px}
nav a:hover,nav a.active{color:#FF6B00}
.logout{background:none;border:1px solid #3a3a3a;color:#aaa;padding:.3rem .8rem;border-radius:4px;cursor:pointer;font-size:.85rem;margin-left:1.5rem}
.logout:hover{border-color:#FF6B00;color:#FF6B00}
.main{max-width:1100px;margin:0 auto;padding:2.5rem 2rem}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
h1{font-size:1.8rem}
.btn-new{background:#FF6B00;color:#fff;text-decoration:none;padding:.6rem 1.2rem;border-radius:6px;font-weight:700;font-size:.9rem}
.btn-new:hover{background:#e05e00}
.table-wrap{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.75rem 1rem;font-size:.8rem;color:#FF6B00;text-transform:uppercase;letter-spacing:.05em;background:#151515;border-bottom:1px solid #2a2a2a}
td{padding:.75rem 1rem;border-bottom:1px solid #222;font-size:.9rem;color:#ccc;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1e1e1e}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.75rem;font-weight:600}
.badge.active{background:rgba(34,197,94,.15);color:#4ade80}
.badge.inactive{background:rgba(100,100,100,.2);color:#888}
.type-badge{padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:600}
.type-badge.amazon{background:rgba(255,153,0,.15);color:#ffa500}
.type-badge.aliexpress{background:rgba(255,0,0,.1);color:#f87171}
.type-badge.own{background:rgba(99,102,241,.15);color:#a5b4fc}
.btn-sm{background:#2a2a2a;color:#f0f0f0;text-decoration:none;padding:.3rem .7rem;border-radius:4px;font-size:.8rem;border:1px solid #3a3a3a;cursor:pointer;margin-right:.25rem}
.btn-sm:hover{border-color:#FF6B00;color:#FF6B00}
.btn-sm.danger{background:none;color:#f87171;border-color:#3a3a3a}
.btn-sm.danger:hover{border-color:#f87171}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">BIKE<span>LABS</span> <span style="color:#666;font-size:.75rem;font-weight:400;margin-left:.5rem">Admin</span></div>
  <nav>
    <a href="/admin">Dashboard</a>
    <a href="/admin/articles">Articles</a>
    <a href="/admin/shop" class="active">Shop</a>
    <form method="POST" action="/admin/logout" style="display:inline">
      <button class="logout">Sign Out</button>
    </form>
  </nav>
</div>
<div class="main">
  <div class="page-head">
    <h1>Shop Products</h1>
    <a href="/admin/shop/new" class="btn-new">+ New Product</a>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Category</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>{{ROWS}}</tbody>
    </table>
  </div>
</div>
</body>
</html>
