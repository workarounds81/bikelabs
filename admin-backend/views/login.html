<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BikeLabs Admin Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#f0f0f0;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:2.5rem;width:100%;max-width:380px}
.logo{font-size:1.8rem;font-weight:900;color:#FF6B00;text-align:center;margin-bottom:.25rem;letter-spacing:-1px}
.logo span{color:#f0f0f0}
.sub{text-align:center;color:#666;font-size:.9rem;margin-bottom:2rem}
.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;padding:.75rem 1rem;border-radius:6px;font-size:.9rem;margin-bottom:1rem;display:none}
.error.show{display:block}
label{display:block;font-size:.8rem;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem;margin-top:1.25rem}
input{width:100%;background:#2a2a2a;border:1px solid #3a3a3a;color:#f0f0f0;padding:.7rem 1rem;border-radius:6px;font-size:1rem}
input:focus{outline:none;border-color:#FF6B00}
button{width:100%;background:#FF6B00;color:#fff;border:none;padding:.85rem;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1.5rem;text-transform:uppercase;letter-spacing:.05em}
button:hover{background:#e05e00}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">BIKE<span>LABS</span></div>
  <div class="sub">Admin Panel</div>
  <div class="error {{ERROR_CLASS}}">Invalid username or password.</div>
  <form method="POST" action="/admin/login">
    <label>Username</label>
    <input type="text" name="username" autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password">
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
